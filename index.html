<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venice Uncensored - OpenRouter Client</title>
    <!-- Tailwind CSS for modern, sleek styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js to render Markdown responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Custom scrollbar for chat container */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        /* Markdown formatting tweaks inside chat bubbles */
        .prose pre {
            background-color: #1f2937 !important;
            color: #f3f4f6 !important;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            overflow-x: auto;
        }
        .prose code {
            color: #f43f5e;
            background-color: rgba(31, 41, 55, 0.6);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }
        .prose pre code {
            color: inherit;
            background-color: transparent;
            padding: 0;
        }
        .prose p {
            margin-bottom: 0.75rem;
        }
        .prose p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 bg-red-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wide text-white">Venice <span class="text-red-500 font-light">Uncensored</span></h1>
        </div>
        <div class="flex items-center space-x-4 text-sm text-gray-400">
            <span class="hidden sm:inline bg-gray-800 px-3 py-1 rounded-full border border-gray-700">Model: Dolphin Mistral Venice</span>
            <button id="clearBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition cursor-pointer text-xs font-medium">Clear Chat</button>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 max-w-4xl w-full mx-auto">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-4">
            <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center text-white font-bold flex-shrink-0 shadow-lg">V</div>
            <div class="bg-gray-900 border border-gray-800 rounded-2xl px-5 py-4 max-w-[85%] sm:max-w-[75%] shadow-md prose prose-invert text-sm">
                <p>System initialized. Ready to process requests through the Venice-edition OpenRouter gateway. How can I assist you today?</p>
            </div>
        </div>
    </main>

    <!-- Input Bar -->
    <footer class="bg-gray-900 border-t border-gray-800 p-4 sm:p-6 shadow-lg">
        <form id="chatForm" class="max-w-4xl mx-auto flex items-center gap-3">
            <div class="relative flex-1">
                <textarea 
                    id="userInput" 
                    rows="1" 
                    placeholder="Type your message..." 
                    class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3.5 pr-12 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 resize-none max-h-32 transition shadow-inner"
                    required
                ></textarea>
            </div>
            <button 
                type="submit" 
                id="sendBtn"
                class="bg-red-600 hover:bg-red-500 text-white px-5 py-3.5 rounded-xl font-medium transition duration-200 flex items-center justify-center shadow-lg shadow-red-950/40 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed h-[48px]"
            >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                    <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" />
                </svg>
            </button>
        </form>
    </footer>

    <!-- Script Application Logic -->
    <script>
        const apiKey = "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";
        const modelName = "cognitivecomputations/dolphin-mistral-24b-venice-edition";

        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Conversation history array for context continuity
        let messages = [
            { role: "system", content: "You are an uncensored AI assistant running the Venice edition model via OpenRouter." }
        ];

        // Auto-resize textarea as user types
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Submit on Enter key (Shift + Enter for new line)
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.requestSubmit();
            }
        });

        // Clear chat history
        clearBtn.addEventListener('click', () => {
            messages = [
                { role: "system", content: "You are an uncensored AI assistant running the Venice edition model via OpenRouter." }
            ];
            chatContainer.innerHTML = `
                <div class="flex items-start space-x-4">
                    <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center text-white font-bold flex-shrink-0 shadow-lg">V</div>
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl px-5 py-4 max-w-[85%] sm:max-w-[75%] shadow-md prose prose-invert text-sm">
                        <p>Chat history cleared. Ready for new input.</p>
                    </div>
                </div>
            `;
        });

        // Append message to UI
        function appendMessage(role, content) {
            const isUser = role === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-4 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center text-white font-bold flex-shrink-0 shadow-lg ${isUser ? 'bg-gray-700' : 'bg-red-600'}`;
            avatar.textContent = isUser ? 'U' : 'V';

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl px-5 py-4 max-w-[85%] sm:max-w-[75%] shadow-md text-sm ${
                isUser 
                    ? 'bg-red-600 text-white rounded-br-none' 
                    : 'bg-gray-900 border border-gray-800 text-gray-100 rounded-bl-none prose prose-invert'
            }`;

            if (isUser) {
                bubble.textContent = content;
            } else {
                bubble.innerHTML = marked.parse(content);
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Handle Form Submission
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Clear input and reset height
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            // Add user message to history and UI
            messages.push({ role: 'user', content: text });
            appendMessage('user', text);

            // Create loading placeholder for assistant response
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = `flex items-start space-x-4`;
            loadingDiv.id = loadingId;
            loadingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center text-white font-bold flex-shrink-0 shadow-lg">V</div>
                <div class="bg-gray-900 border border-gray-800 rounded-2xl px-5 py-4 max-w-[85%] sm:max-w-[75%] shadow-md text-sm text-gray-400 flex items-center space-x-2">
                    <span class="inline-block w-2 h-2 bg-red-500 rounded-full animate-bounce"></span>
                    <span class="inline-block w-2 h-2 bg-red-500 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                    <span class="inline-block w-2 h-2 bg-red-500 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                </div>
            `;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Venice Uncensored Client"
                    },
                    body: JSON.stringify({
                        model: modelName,
                        messages: messages
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const assistantReply = data.choices[0].message.content;

                // Remove loading element
                document.getElementById(loadingId).remove();

                // Push to history and display response
                messages.push({ role: 'assistant', content: assistantReply });
                appendMessage('assistant', assistantReply);

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('assistant', `⚠️ **Error communicating with OpenRouter API:** ${error.message}`);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        });
    </script>
</body>
</html>
